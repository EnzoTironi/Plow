name: Runtime checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML aiohttp
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
