# Zoen model map. enable-zoen-face deep-merges this over the Hermes seed.
# Reception sends the first ack independently of the talker's latency.
# Native Kanban requires an explicit opt-in; platform defaults remain intact.
toolsets:
  - kanban
agent:
  disabled_toolsets:
    - clarify
browser:
  backend: local
model:
  default: openai/gpt-5.6-luna
  provider: plow
providers:
  plow:
    models:
      anthropic/claude-sonnet-5: {}
      anthropic/claude-opus-5: {}
      openai/gpt-5.6-luna: {}
      moonshotai/kimi-k3: {}
auxiliary:
  vision:
    provider: plow
    model: anthropic/claude-sonnet-5
