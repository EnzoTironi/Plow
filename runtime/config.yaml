# Zoen model map. enable-zoen-face deep-merges this over the Hermes seed.
# Every call is Luna. A short model call writes reception while the main turn is prepared.
# Native Kanban requires an explicit opt-in; platform defaults remain intact.
zoen:
  reception_model: openai/gpt-5.6-luna
  oauth_relay_url: https://zoen-oauth-relay.agenttironi.workers.dev
  google_relay_url: https://zoen-oauth-relay.agenttironi.workers.dev
toolsets:
  - kanban
agent:
  disabled_toolsets:
    - clarify
browser:
  backend: local
model:
  default: openai/gpt-5.6-luna
  provider: plow
fallback_model:
  provider: plow
  model: openai/gpt-5.6-luna
# The talker, the opening, vision, fallback, and every delegate_task child are Luna.
delegation:
  provider: plow
  model: openai/gpt-5.6-luna
  reasoning_effort: high
providers:
  plow:
    models:
      openai/gpt-5.6-luna: {}
auxiliary:
  vision:
    provider: plow
    model: openai/gpt-5.6-luna
